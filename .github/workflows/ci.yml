name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and tests
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Run tests
        run: pytest -q

  quality-observation:
    name: Quality observation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install quality tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-cov ruff mypy bandit pip-audit radon vulture pylint

      # These checks are deliberately observational first. A signal becomes a
      # blocking gate only after its real baseline is known and documented.
      - name: Branch coverage baseline
        continue-on-error: true
        run: pytest -q --cov=agentwitness --cov-branch --cov-report=term-missing

      - name: Ruff baseline
        continue-on-error: true
        run: ruff check src tests

      - name: mypy baseline
        continue-on-error: true
        run: mypy src/agentwitness

      - name: Bandit baseline
        continue-on-error: true
        run: bandit -q -r src -ll -ii

      - name: Dependency audit baseline
        continue-on-error: true
        run: pip-audit .

      - name: Cyclomatic complexity baseline
        continue-on-error: true
        run: radon cc src/agentwitness -s -a

      - name: Duplication baseline
        continue-on-error: true
        run: pylint src/agentwitness tests --disable=all --enable=duplicate-code --score=no

      - name: Dead-code baseline
        continue-on-error: true
        run: vulture src/agentwitness --min-confidence 80
